# Seed list of maritime/port-tech start-ups to evaluate.
# Selection rule: public, independent maritime/port-tech start-ups with at
#   least one working English-language URL, not in a current accelerator cohort.
# Verified 2026-10-07.

startups:
  - name: "Portchain"
    slug: "portchain"
    urls:
      - "https://portchain.com"
      - "https://portchain.com/about-us-portchain"
    notes: "Port-call and terminal coordination software. Expected theme: logistics_operations."

  - name: "Searoutes"
    slug: "searoutes"
    urls:
      - "https://searoutes.com"
      - "https://searoutes.com/about"
    notes: "Routing and emissions-calculation data for freight. Expected theme: logistics_operations."

  - name: "Norsepower"
    slug: "norsepower"
    urls:
      - "https://www.norsepower.com"
      - "https://www.norsepower.com/norsepower/"
    notes: "Wind-assisted propulsion (rotor sails). Expected theme: decarbonisation_energy."

  - name: "Orca AI"
    slug: "orca-ai"
    urls:
      - "https://www.orca-ai.io"
      - "https://www.orca-ai.io/about"
    notes: "AI situational awareness and collision avoidance. Expected theme: safety_security."

  - name: "Cydome"
    slug: "cydome"
    urls:
      - "https://www.cydome.io"
      - "https://www.cydome.io/about"
    notes: "Maritime cybersecurity. Expected theme: safety_security."

