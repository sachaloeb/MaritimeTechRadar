[project]
name = "maritime-tech-radar"
version = "0.1.0"
description = "Config-driven pipeline and Streamlit dashboard that ranks public maritime/port-tech start-ups on a technology radar."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "requests==2.32.3",
    "beautifulsoup4==4.13.4",
    "lxml==5.4.0",
    "pyyaml==6.0.2",
    "pydantic==2.11.4",
    "pandas==2.2.3",
    "plotly==6.1.2",
    "streamlit==1.45.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "responses==0.25.7",
    "ruff==0.11.12",
]

[project.scripts]
radar = "radar.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]